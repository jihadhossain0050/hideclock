plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.jihad.hidelockscreenclock'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.jihad.hidelockscreenclock'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Legacy Xposed API for broad compatibility with LSPosed-compatible managers.
    compileOnly 'de.robv.android.xposed:api:82'
}
